services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: "sqlite:////app/backend/db/video_editor.db"
      UPLOAD_DIR: "/app/backend/data/videos"
      STORAGE_DIR: "/app/backend/storage"
    volumes:
      - vidai_videos:/app/backend/data/videos
      - vidai_storage:/app/backend/storage
      - vidai_db:/app/backend/db
      - vidai_whisper_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: vidai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vidai_videos:
  vidai_storage:
  vidai_db:
  vidai_whisper_cache:
